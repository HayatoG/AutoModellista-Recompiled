# CI da runtime (M3). O C gerado a partir do jogo NÃO existe aqui (é material da Capcom e fica fora do git), então
# tudo compila com AM_WITH_GENERATED=OFF: a runtime liga contra um stub (core/recomp_stub.c) e os testes usam funções
# sintéticas. O link do C gerado (DOL + RELs) é verificado localmente: docs/M3_ESQUELETO.md.
name: ci

on:
  push:
  pull_request:

env:
  # Mesmas versões do ambiente local (docs/M3_ESQUELETO.md); o estilo depende da versão do clang-format.
  CLANG_FORMAT_VERSION: "21.1.8"
  CLANG_TIDY_VERSION: "21.1.6"

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "clang-format==${CLANG_FORMAT_VERSION}"
      - name: clang-format --dry-run -Werror
        run: find runtime tests/unit -type f \( -name '*.c' -o -name '*.h' \) -print0 | xargs -0 clang-format --dry-run -Werror

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "macOS arm64 Debug (ASan+UBSan)", os: macos-14, build_type: Debug, sanitize: ON, tidy: false }
          - { name: "macOS arm64 Release", os: macos-14, build_type: Release, sanitize: OFF, tidy: false }
          - { name: "Linux x86_64 Debug (ASan+UBSan)", os: ubuntu-24.04, build_type: Debug, sanitize: ON, tidy: false }
          - { name: "Linux x86_64 Release + clang-tidy", os: ubuntu-24.04, build_type: Release, sanitize: OFF, tidy: true }
          - { name: "Windows x86_64 clang-cl Release", os: windows-2022, build_type: Release, sanitize: OFF, tidy: false }
    steps:
      - uses: actions/checkout@v4

      - name: DolRecomp (cpu.h e cpu.c)
        shell: bash
        run: scripts/ci_fetch_dolrecomp.sh

      - name: Dependências da SDL3 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxss-dev libxkbcommon-dev libwayland-dev libdrm-dev libgbm-dev libgl1-mesa-dev \
            libegl1-mesa-dev libudev-dev libdbus-1-dev

      - name: Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress -y

      - name: Ambiente do MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configurar
        shell: bash
        run: |
          extra=()
          if [[ "$RUNNER_OS" == "Windows" ]]; then extra+=(-DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl); fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DAM_WITH_GENERATED=OFF \
            -DAM_SANITIZE=${{ matrix.sanitize }} \
            "${extra[@]}"

      - name: Compilar
        run: cmake --build build

      - name: ctest
        run: ctest --test-dir build --output-on-failure

      - name: Executável (inicia e termina limpo)
        shell: bash
        run: |
          exe=build/runtime/automodellista
          [[ -x $exe || -x $exe.exe ]] || exe=build/runtime/automodellista.exe
          "$exe" --selftest

      - name: clang-tidy
        if: matrix.tidy
        run: |
          pip install "clang-tidy==${CLANG_TIDY_VERSION}"
          find runtime tests/unit -type f -name '*.c' -print0 | xargs -0 clang-tidy -p build --quiet
